naftiko: 1.0.0-alpha2
info:
  label: CNH FieldOps API — Farm Setup
  description: 'CNH FieldOps API — Farm Setup. 3 operations. Lead operation: List farms. Self-contained Naftiko capability
    covering one Cnh business surface.'
  tags:
  - Cnh
  - Farm Setup
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CNH_API_KEY: CNH_API_KEY
capability:
  consumes:
  - type: http
    namespace: fieldops-farm-setup
    baseUri: https://api.fieldops.cnh.com
    description: CNH FieldOps API — Farm Setup business capability. Self-contained, no shared references.
    resources:
    - name: farms
      path: /farms
      operations:
      - name: listfarms
        method: GET
        description: List farms
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: growerId
          in: query
          type: string
    - name: fields
      path: /fields
      operations:
      - name: listfields
        method: GET
        description: List fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: farmId
          in: query
          type: string
    - name: growers
      path: /growers
      operations:
      - name: listgrowers
        method: GET
        description: List growers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CNH_API_KEY}}'
  exposes:
  - type: rest
    namespace: fieldops-farm-setup-rest
    port: 8080
    description: REST adapter for CNH FieldOps API — Farm Setup. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/farms
      name: farms
      description: REST surface for farms.
      operations:
      - method: GET
        name: listfarms
        description: List farms
        call: fieldops-farm-setup.listfarms
        with:
          growerId: rest.growerId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/fields
      name: fields
      description: REST surface for fields.
      operations:
      - method: GET
        name: listfields
        description: List fields
        call: fieldops-farm-setup.listfields
        with:
          farmId: rest.farmId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/growers
      name: growers
      description: REST surface for growers.
      operations:
      - method: GET
        name: listgrowers
        description: List growers
        call: fieldops-farm-setup.listgrowers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: fieldops-farm-setup-mcp
    port: 9090
    transport: http
    description: MCP adapter for CNH FieldOps API — Farm Setup. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-farms
      description: List farms
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fieldops-farm-setup.listfarms
      with:
        growerId: tools.growerId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-fields
      description: List fields
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fieldops-farm-setup.listfields
      with:
        farmId: tools.farmId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-growers
      description: List growers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fieldops-farm-setup.listgrowers
      outputParameters:
      - type: object
        mapping: $.
