naftiko: 1.0.0-alpha2
info:
  label: CNH FieldOps API — Tokens
  description: 'CNH FieldOps API — Tokens. 1 operations. Lead operation: Exchange refresh token for access token. Self-contained
    Naftiko capability covering one Cnh business surface.'
  tags:
  - Cnh
  - Tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CNH_API_KEY: CNH_API_KEY
capability:
  consumes:
  - type: http
    namespace: fieldops-tokens
    baseUri: https://api.fieldops.cnh.com
    description: CNH FieldOps API — Tokens business capability. Self-contained, no shared references.
    resources:
    - name: oauth-token
      path: /oauth/token
      operations:
      - name: createaccesstoken
        method: POST
        description: Exchange refresh token for access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CNH_API_KEY}}'
  exposes:
  - type: rest
    namespace: fieldops-tokens-rest
    port: 8080
    description: REST adapter for CNH FieldOps API — Tokens. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/oauth/token
      name: oauth-token
      description: REST surface for oauth-token.
      operations:
      - method: POST
        name: createaccesstoken
        description: Exchange refresh token for access token
        call: fieldops-tokens.createaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: fieldops-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for CNH FieldOps API — Tokens. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: exchange-refresh-token-access-token
      description: Exchange refresh token for access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: fieldops-tokens.createaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
